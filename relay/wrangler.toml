name = "monnett-review-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

[observability]
enabled = true

[vars]
ROUTES = '{"monnett-social/monnett-core": "", "monnett-social/monnett-app": "_APP"}'

# created with: npx wrangler kv namespace create SEEN
[[kv_namespaces]]
binding = "SEEN"
id = "95009b3b7eb249f5a93d437166f1ce46"

# secrets (not in this file):
#   npx wrangler secret put BB_WEBHOOK_SECRET
#   npx wrangler secret put ROUTINE_FIRE_URL        (monnett-core routine)
#   npx wrangler secret put ROUTINE_FIRE_TOKEN
#   npx wrangler secret put ROUTINE_FIRE_URL_APP    (monnett-app routine)
#   npx wrangler secret put ROUTINE_FIRE_TOKEN_APP
